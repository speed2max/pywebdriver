# Speed2Max: checks on our main branch, dev. Upstream's main.yml only runs on
# master, which is a mirror of upstream; it is left untouched.
name: S2M checks

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.1

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Unit tests
        run: |
          if [ -d tests ]; then
            python -I -m unittest discover -s tests -v
          else
            echo "No tests directory yet."
          fi
